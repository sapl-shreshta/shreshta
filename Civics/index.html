<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Civics ⚖️</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif;}
  body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ffe0f0,#e0f7ff,#fff5d6);
    color:#1d2b53;padding:16px 12px;text-align:center;
  }
  .back{
    position:absolute;top:30px;left:30px;
    background:#a06cd5;color:white;text-decoration:none;
    padding:12px 24px;border-radius:50px;font-weight:bold;
    box-shadow:0 5px 0 #7b4aaf;
  }
  .big{font-size:clamp(80px,15vw,160px);animation:bounce 2s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}
  h1{
    font-size:clamp(40px,6vw,72px);margin:20px 0;
    background:linear-gradient(90deg,#ff6ec7,#ffd166,#06d6a0,#4cc9f0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p.sub{font-size:clamp(18px,2.4vw,26px);color:#a06cd5;max-width:600px;margin-top:10px;}

  /* Topic cards */
  .topics{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:36px;}
  .topic-card{
    background:white;border-radius:24px;padding:24px 22px;
    box-shadow:0 8px 0 rgba(0,0,0,.1);
    flex:1 1 220px;max-width:280px;text-align:center;
    border-top:7px solid var(--c);
    text-decoration:none;color:#1d2b53;
    transition:transform .15s, box-shadow .15s;
    display:block;
  }
  .topic-card:hover{transform:translateY(-5px);box-shadow:0 13px 0 rgba(0,0,0,.08);}
  .topic-card .icon{font-size:46px;margin-bottom:10px;}
  .topic-card h2{font-size:20px;color:var(--c);margin-bottom:8px;}
  .topic-card p{font-size:14px;color:#666;line-height:1.5;}
</style>
</head>
<body>
  <a class="back" href="../index.html">⬅️ Home</a>
  <div class="big">⚖️</div>
  <h1>Civics</h1>
  <p class="sub">Pick a topic to start learning! 🎉</p>

  <div class="topics">
    <a class="topic-card" style="--c:#ff6ec7" href="importance-of-civics.html">
      <div class="icon">🏛️</div>
      <h2>Importance of Civics</h2>
      <p>Learn how government works, the 3 organs, and how civics shapes our villages!</p>
    </a>
  </div>
</body>
</html>
