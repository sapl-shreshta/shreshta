# 🤝 BRICS Summit 2026

## 📋 The Basics
- 18th summit · 12–13 Sep 2026
- Bharat Mandapam, New Delhi
- Chair: India (4th time) · PM Modi presided
- Theme: Resilience, Innovation, Cooperation, Sustainability
  - First letters spell B-R-I-C-S!
- 20 years of BRICS (2006 → 2026)
- Result: New Delhi Declaration (~140 paragraphs)
- Next host: China (2027)

## 🌍 What is BRICS
- Name: Jim O'Neill, Goldman Sachs, 2001
- First summit 2009, Yekaterinburg
- South Africa joined 2010
- 11 members
  - Founders: Brazil, Russia, India, China
  - South Africa (2010)
  - Egypt, Ethiopia, Iran, UAE (2024)
  - Indonesia (2025)
  - Saudi Arabia (invited; status unclear)
- 10 partner countries
- ~49.5% of people · ~40% of GDP · ~26% of trade
- No treaty, no secretariat, decides by consensus

## 👥 Who Came
- Modi, Putin, Xi, Ramaphosa
- Xi's first India visit in ~7 years
- Lula absent (election) → FM Mauro Vieira
- Saudi FM Prince Faisal bin Farhan
- 10 partners + AU, ASEAN, CELAC
- NDB, AIIB, ISA, CDRI

## 🏛️ Global Governance
- Reform UN Security Council
  - More seats for Asia, Africa, Latin America
  - China & Russia back India/Brazil "greater role"
  - Ezulwini Consensus & Sirte Declaration (Africa)
- Reform IMF quotas & World Bank
- Voice of the Global South
- Multipolar world
- 10-point roadmap: Representation, Responsiveness, Rule-making

## 💰 Money & Finance
- NO common currency
- Local-currency settlement
- BRICS Payment Task Force
- New Development Bank (Shanghai)
  - More local-currency loans
  - More members welcome
- Contingent Reserve Arrangement
  - Amendments + 9th test run
- BRICS Risk Lab, GIFT City (reinsurance)
- Tax Cross-Learning Lab · customs cooperation

## 🚢 Trade & Economy
- Against unilateral tariffs & sanctions
- WTO at the centre — fix dispute settlement
- WTO entry for Ethiopia & Iran
- MSMEs
  - Jaipur Consensus: invoice discounting
  - MSME Portal
- Startups: Incubator Network, Startup Innovation Fund
- Resilient supply chains & critical minerals
- Worry about carbon border taxes (CBAM)

## 🌾 Food & Farming
- BRICS Grain Exchange (target 2027)
- BRICS AGRIN (seeds & germplasm)
- Global Forum on Farmers' Rights
- Digital Agriculture Network

## 🤖 Technology
- AI: safe, trustworthy, inclusive, energy-efficient
  - Leaders' Statement on Global AI Governance
  - India's AI Impact Summit (Feb 2026)
- Digital Public Infrastructure Repository
- Quantum research network
- Cybersecurity, deepfakes, annual cyber drills
- BRICS Space Council · satellite constellation
- Undersea cable feasibility study

## 🏥 Health & People
- Mental health network led by NIMHANS
- BRICS BioDesign Centre (AP MedTech Zone)
- Digital health compendium
- Pandemic preparedness, vaccines
- Youth Cooperation Framework 2026

## 🌱 Sustainability
- Paris Agreement & UNFCCC
- Climate finance for developing countries
- Forests, mangroves, drought, biodiversity
- Big cat conservation 🐅
- Energy for All (Gurugram)
- Sustainable aviation fuels

## 🕊️ Peace & Security
- Middle East: "maximum restraint", no country named
  - Softer than 2025
- Gaza: end war, aid, two-state solution (1967 borders)
- Ukraine: "dialogue and diplomacy" only
- Terrorism: Pahalgam condemned, zero tolerance, CCIT
- Network to trace fugitive offenders

## 🎪 India's Balancing Act
- "BRICS is not against anyone"
- USA not named
- Strategic autonomy / multi-alignment
- Modi–Putin: $100 bn trade by 2030
- Modi–Xi: calmer border, trade imbalance
- Iran–UAE met in Delhi
