# Physical Quantities and Measurement

## Introduction
- Measurement helps us compare things like length, weight, and temperature
- We use measurement daily for buying fruits, tailoring clothes, and checking health

## Physical Quantities
- Things we can measure: length, mass, time, temperature, volume
- Fundamental Quantities: basic, not dependent on others (length, mass, time, temperature, electric current, luminous intensity, amount of substance)
- Derived Quantities: made from fundamental ones (area, volume, speed, force, density)

## Measurement of Physical Quantities
- Comparing an unknown quantity with a known unit
- Formula: P = N × U (Physical quantity = Magnitude × Unit)
- Example: 2 kg (2 is magnitude, kg is unit)

## Units
- Fixed standards for measuring quantities
- Standard Units (SI, CGS, FPS): reliable and internationally accepted
- Non-standard Units (cubit, handspan): not reliable - body parts vary in size

## SI Units (International System)
- Established in 1960 for consistency worldwide
- Seven Fundamental SI Units
  - Length: metre (m)
  - Mass: kilogram (kg)
  - Time: second (s)
  - Temperature: kelvin (K)
  - Electric Current: ampere (A)
  - Luminous Intensity: candela (cd)
  - Amount of Substance: mole (mol)
- Rules for SI Units
  - Unit names in small letters (metre, newton)
  - No full stop after symbols (5 m, not 5 m.)
  - Symbols don't have plural (5 m, not 5 ms)
  - Symbols from scientist names are capital (N for newton)

## Multiples and Submultiples
- Prefixes help measure very large or very small quantities
- milli (m) = 1/1000 → 1 mm = 0.001 m
- centi (c) = 1/100 → 1 cm = 0.01 m
- kilo (k) = 1000 → 1 km = 1000 m
- Example: 100000 m = 100 km, 0.004 m = 4 mm

## Measuring Length
- Length is the distance between two ends of an object
- SI Unit: metre (m) | Smallest division on ruler: 1 mm
- Instruments: Ruler, Metre rod, Measuring tape, Vernier callipers
- How to Use a Ruler
  - Lay ruler flat and parallel to object
  - Line up zero mark with one end
  - Look straight down (avoid parallax error)
  - If ruler is broken: end reading - start reading

## Measuring Area
- Area is the space inside a 2D shape
- SI Unit: square metre (m²)
- Area Formulas
  - Rectangle = length × breadth
  - Square = side × side
  - Triangle = ½ × base × height
  - Irregular shapes: use graph paper and count squares

## Measuring Mass
- Mass is the amount of matter in an object
- SI Unit: kilogram (kg)
- Common Mass Units
  - 1000 mg = 1 g (gram)
  - 1000 g = 1 kg (kilogram)
  - 100 kg = 1 quintal
  - 1000 kg = 1 tonne
- Instruments for Measuring Mass
  - Beam Balance: two pans, compares with standard weights
  - Electronic Balance: digital, high precision, instant reading
  - Physical Balance: very sensitive, used in labs
  - Check zero reading before measuring for accuracy

## Measuring Time
- Time is the interval between two events
- SI Unit: second (s)
- Time Units
  - 60 s = 1 minute (min)
  - 60 min = 1 hour (h)
  - 24 hours = 1 day
  - 100 years = 1 century
- Instruments for Measuring Time
  - Historical: Sundial, sand clock, water clock
  - Modern: Mechanical clock, digital clock, stopwatch
  - Stopwatch can measure time as small as 0.01 seconds
- Clock Systems
  - 12-hour system: day split into a.m. and p.m.
  - 24-hour system: hours from 0 to 23 (used by railways)

## Measuring Temperature
- Temperature shows how hot or cold a body is
- SI Unit: kelvin (K) | Common: degree Celsius (°C), Fahrenheit (°F)
- How a Thermometer Works
  - Contains glass tube with mercury or alcohol liquid
  - Heat: liquid expands and rises up the tube
  - Cold: liquid shrinks and falls down
  - Level of liquid indicates temperature on markings
- Types of Thermometers
  - Clinical: measures body temperature (35-42°C), has a kink
  - Laboratory: measures -10°C to 110°C, no kink
  - Maximum-minimum: records highest and lowest temperatures
  - Normal body temperature = 37°C
- Temperature Conversion Formulas
  - °F = (9/5 × °C) + 32
  - °C = 5/9 (°F - 32)
  - K = °C + 273
  - Water freezes at 0°C (273 K) and boils at 100°C (373 K)
