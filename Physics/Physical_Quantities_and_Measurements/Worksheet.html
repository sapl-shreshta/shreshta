<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Physical Quantities & Measurement - Interactive Quiz</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Arial', 'Helvetica', sans-serif;
    background: #f5f5f5;
    color: #333;
  }

  /* Password Screen */
  .password-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }

  .password-box {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    text-align: center;
    width: 90%;
    max-width: 400px;
  }

  .password-box h1 {
    color: #667eea;
    margin-bottom: 30px;
    font-size: 28px;
  }

  .password-box p {
    color: #666;
    margin-bottom: 20px;
    font-size: 14px;
  }

  .password-input {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 6px;
    font-size: 16px;
    margin-bottom: 20px;
    transition: border-color 0.3s;
  }

  .password-input:focus {
    outline: none;
    border-color: #667eea;
  }

  .password-btn {
    width: 100%;
    padding: 12px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
  }

  .password-btn:hover {
    background: #764ba2;
  }

  .error-msg {
    color: #e74c3c;
    margin-top: 10px;
    font-size: 14px;
    display: none;
  }

  /* Quiz Screen */
  .quiz-screen {
    display: none;
  }

  .quiz-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
    background: white;
  }

  .header {
    text-align: center;
    border-bottom: 3px solid #667eea;
    padding-bottom: 20px;
    margin-bottom: 30px;
  }

  .header h1 {
    color: #667eea;
    font-size: 32px;
    margin-bottom: 10px;
  }

  .score-box {
    display: inline-block;
    background: #667eea;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    margin-top: 10px;
  }

  .section {
    margin-bottom: 40px;
    page-break-inside: avoid;
  }

  .section-title {
    background: #667eea;
    color: white;
    padding: 12px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    margin-bottom: 20px;
  }

  .question {
    margin-bottom: 25px;
    padding: 20px;
    background: #f9f9f9;
    border-left: 4px solid #667eea;
    border-radius: 4px;
    page-break-inside: avoid;
  }

  .question-text {
    font-weight: 600;
    color: #333;
    margin-bottom: 15px;
    font-size: 15px;
  }

  .options {
    margin-left: 20px;
  }

  .option {
    padding: 10px 0;
    color: #555;
    font-size: 14px;
    line-height: 1.8;
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: background 0.2s;
    padding: 10px;
    border-radius: 4px;
  }

  .option input[type="radio"] {
    margin-right: 12px;
    cursor: pointer;
    width: 18px;
    height: 18px;
  }

  .option:hover {
    background: #e8e8e8;
  }

  .feedback {
    margin-top: 12px;
    padding: 10px 15px;
    border-radius: 4px;
    display: none;
    font-weight: 600;
    font-size: 14px;
  }

  .feedback.correct {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    display: block;
  }

  .feedback.incorrect {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
    display: block;
  }

  .controls {
    text-align: center;
    margin-top: 30px;
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 12px 30px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
  }

  .btn-primary {
    background: #667eea;
    color: white;
  }

  .btn-primary:hover {
    background: #764ba2;
  }

  .btn-secondary {
    background: #e74c3c;
    color: white;
  }

  .btn-secondary:hover {
    background: #c0392b;
  }

  .btn-success {
    background: #27ae60;
    color: white;
  }

  .btn-success:hover {
    background: #229954;
  }

  .results {
    background: #e8f5e9;
    border: 2px solid #4caf50;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    margin: 30px 0;
    display: none;
  }

  .results h2 {
    color: #2e7d32;
    margin-bottom: 10px;
    font-size: 28px;
  }

  .results p {
    color: #555;
    font-size: 16px;
    margin: 5px 0;
  }

  .progress-bar {
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 5px;
    overflow: hidden;
    margin: 20px 0;
  }

  .progress-fill {
    height: 100%;
    background: #4caf50;
    width: 0%;
    transition: width 0.3s;
  }

  @media print {
    body {
      background: white;
    }
    .password-screen, .controls, .results {
      display: none !important;
    }
    .quiz-container {
      padding: 0;
      max-width: 100%;
    }
    .question {
      page-break-inside: avoid;
    }
    .section {
      page-break-inside: avoid;
    }
  }
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div class="password-screen" id="passwordScreen">
  <div class="password-box">
    <h1>📋 Quiz Access</h1>
    <p>Enter password to access the interactive quiz (130 questions)</p>
    <input type="password" id="passwordInput" class="password-input" placeholder="Enter password" />
    <button class="password-btn" onclick="checkPassword()">Start Quiz</button>
    <div class="error-msg" id="errorMsg">❌ Incorrect password. Try again.</div>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div class="quiz-screen" id="quizScreen">
  <div class="quiz-container">
    <div class="header">
      <h1>📝 Physical Quantities and Measurement - Interactive Quiz</h1>
      <div class="score-box">Score: <span id="scoreDisplay">0</span>/130 | Answered: <span id="answeredDisplay">0</span>/130</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="results" id="results">
      <h2 id="resultTitle">Quiz Complete! 🎉</h2>
      <p id="resultScore"></p>
      <p id="resultPercentage"></p>
      <p id="resultMessage"></p>
    </div>

    <!-- All Sections and Questions -->
    <div id="questionsContainer"></div>

    <div class="controls">
      <button class="btn btn-primary" onclick="scrollToTop()">⬆️ Top</button>
      <button class="btn btn-success" onclick="finishQuiz()">✓ Finish Quiz</button>
      <button class="btn btn-primary" onclick="resetQuiz()">🔄 Reset</button>
      <button class="btn btn-secondary" onclick="logout()">🚪 Logout</button>
    </div>
  </div>
</div>

<script>
  const CORRECT_PASSWORD = 'threddy@123';

  // Answer key: question ID -> correct option letter (A, B, C, D)
  const answerKey = {
    'q1_1': 'B', 'q1_2': 'C', 'q1_3': 'A', 'q1_4': 'C', 'q1_5': 'C', 'q1_6': 'B',
    'q2_1': 'D', 'q2_2': 'C', 'q2_3': 'D', 'q2_4': 'B', 'q2_5': 'C', 'q2_6': 'A', 'q2_7': 'C', 'q2_8': 'C', 'q2_9': 'A', 'q2_10': 'C',
    'q3_1': 'B', 'q3_2': 'C', 'q3_3': 'B', 'q3_4': 'B', 'q3_5': 'C', 'q3_6': 'C', 'q3_7': 'B', 'q3_8': 'C', 'q3_9': 'B', 'q3_10': 'B',
    'q4_1': 'B', 'q4_2': 'B', 'q4_3': 'C', 'q4_4': 'B', 'q4_5': 'C',
    'q5_1': 'D', 'q5_2': 'C', 'q5_3': 'B', 'q5_4': 'B', 'q5_5': 'B', 'q5_6': 'C', 'q5_7': 'A', 'q5_8': 'B', 'q5_9': 'C', 'q5_10': 'A',
    'q6_1': 'B', 'q6_2': 'B', 'q6_3': 'B', 'q6_4': 'C', 'q6_5': 'B', 'q6_6': 'C', 'q6_7': 'D', 'q6_8': 'B', 'q6_9': 'A', 'q6_10': 'C',
    'q7_1': 'B', 'q7_2': 'C', 'q7_3': 'C', 'q7_4': 'B', 'q7_5': 'B', 'q7_6': 'C', 'q7_7': 'B', 'q7_8': 'C', 'q7_9': 'B', 'q7_10': 'C',
    'q8_1': 'B', 'q8_2': 'B', 'q8_3': 'C', 'q8_4': 'B', 'q8_5': 'C', 'q8_6': 'C', 'q8_7': 'C', 'q8_8': 'C', 'q8_9': 'B', 'q8_10': 'B',
    'q9_1': 'B', 'q9_2': 'C', 'q9_3': 'B', 'q9_4': 'C', 'q9_5': 'C', 'q9_6': 'B', 'q9_7': 'C', 'q9_8': 'C', 'q9_9': 'B', 'q9_10': 'C',
    'q10_1': 'B', 'q10_2': 'A', 'q10_3': 'A', 'q10_4': 'B', 'q10_5': 'A', 'q10_6': 'B', 'q10_7': 'C', 'q10_8': 'A', 'q10_9': 'C', 'q10_10': 'B',
    'q11_1': 'B', 'q11_2': 'C', 'q11_3': 'B', 'q11_4': 'B', 'q11_5': 'C', 'q11_6': 'B', 'q11_7': 'C', 'q11_8': 'B', 'q11_9': 'C', 'q11_10': 'B',
    'q12_1': 'C', 'q12_2': 'B', 'q12_3': 'C', 'q12_4': 'C', 'q12_5': 'A', 'q12_6': 'C', 'q12_7': 'B', 'q12_8': 'B', 'q12_9': 'C', 'q12_10': 'B',
    'q13_1': 'A', 'q13_2': 'C', 'q13_3': 'C', 'q13_4': 'C', 'q13_5': 'B', 'q13_6': 'B', 'q13_7': 'C', 'q13_8': 'A', 'q13_9': 'A', 'q13_10': 'B'
  };

  let score = 0;
  let answered = 0;

  function checkPassword() {
    const input = document.getElementById('passwordInput').value;
    const errorMsg = document.getElementById('errorMsg');

    if (input === CORRECT_PASSWORD) {
      document.getElementById('passwordScreen').style.display = 'none';
      document.getElementById('quizScreen').style.display = 'block';
      errorMsg.style.display = 'none';
      generateQuiz();
    } else {
      errorMsg.style.display = 'block';
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordInput').focus();
    }
  }

  function generateQuiz() {
    const questions = getAllQuestions();
    const container = document.getElementById('questionsContainer');
    let currentSection = '';
    let sectionCount = 0;

    questions.forEach((q, index) => {
      if (q.section !== currentSection) {
        currentSection = q.section;
        sectionCount++;
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'section';
        sectionDiv.innerHTML = `<div class="section-title">${q.section}</div>`;
        container.appendChild(sectionDiv);
      }

      const questionDiv = document.createElement('div');
      questionDiv.className = 'question';
      questionDiv.innerHTML = `
        <div class="question-text">${q.text}</div>
        <div class="options">
          ${q.options.map((opt, i) => `
            <label class="option">
              <input type="radio" name="${q.id}" value="${String.fromCharCode(65 + i)}" onchange="checkAnswer('${q.id}', this.value)">
              ${String.fromCharCode(65 + i)}) ${opt}
            </label>
          `).join('')}
        </div>
        <div class="feedback" id="feedback-${q.id}"></div>
      `;
      container.lastChild.appendChild(questionDiv);
    });
  }

  function checkAnswer(questionId, selectedValue) {
    const correctAnswer = answerKey[questionId];
    const feedback = document.getElementById(`feedback-${questionId}`);
    const wasAnswered = !!document.querySelector(`input[name="${questionId}"]:checked`);

    if (selectedValue === correctAnswer) {
      feedback.className = 'feedback correct';
      feedback.textContent = '✓ Correct!';
      if (!wasAnswered) {
        score++;
        answered++;
      }
    } else {
      feedback.className = 'feedback incorrect';
      feedback.textContent = `✗ Incorrect. Correct answer is: ${correctAnswer}`;
      if (wasAnswered) {
        score--;
      }
      answered++;
    }

    updateScore();
  }

  function updateScore() {
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('answeredDisplay').textContent = answered;
    const percentage = (answered / 130) * 100;
    document.getElementById('progressFill').style.width = percentage + '%';
  }

  function finishQuiz() {
    if (answered === 0) {
      alert('Please answer at least one question!');
      return;
    }

    const percentage = (score / answered) * 100;
    const results = document.getElementById('results');
    const resultScore = document.getElementById('resultScore');
    const resultPercentage = document.getElementById('resultPercentage');
    const resultMessage = document.getElementById('resultMessage');

    resultScore.textContent = `Your Score: ${score}/${answered} (out of 130 total questions)`;
    resultPercentage.textContent = `Accuracy: ${percentage.toFixed(1)}%`;

    if (percentage >= 90) {
      resultMessage.textContent = '🌟 Excellent! Outstanding performance!';
    } else if (percentage >= 75) {
      resultMessage.textContent = '👍 Good! Keep practicing to improve.';
    } else if (percentage >= 60) {
      resultMessage.textContent = '📚 Fair. Review the concepts and try again.';
    } else {
      resultMessage.textContent = '💪 Keep learning! Review the material and practice more.';
    }

    results.style.display = 'block';
    scrollToTop();
  }

  function resetQuiz() {
    if (confirm('Are you sure you want to reset? All answers will be cleared.')) {
      score = 0;
      answered = 0;
      updateScore();
      document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
      document.querySelectorAll('.feedback').forEach(fb => fb.style.display = 'none');
      document.getElementById('results').style.display = 'none';
      scrollToTop();
    }
  }

  function logout() {
    document.getElementById('passwordScreen').style.display = 'flex';
    document.getElementById('quizScreen').style.display = 'none';
    document.getElementById('passwordInput').value = '';
    score = 0;
    answered = 0;
    document.getElementById('questionsContainer').innerHTML = '';
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Question Data
  function getAllQuestions() {
    return [
      // Section 1
      { id: 'q1_1', section: 'Section 1: Fundamentals of Measurement (6 Questions)', text: 'Q1.1: Measurement is the process of:', options: ['Estimating unknown quantities', 'Comparing an unknown quantity with a known fixed amount', 'Recording numerical values', 'Taking observations'] },
      { id: 'q1_2', section: 'Section 1: Fundamentals of Measurement (6 Questions)', text: 'Q1.2: Every measurement consists of:', options: ['Only magnitude', 'Only unit', 'Magnitude and unit', 'Time and space'] },
      { id: 'q1_3', section: 'Section 1: Fundamentals of Measurement (6 Questions)', text: 'Q1.3: In the measurement "5 kg", what is the magnitude?', options: ['5', 'kg', '5 kg', 'kilograms'] },
      { id: 'q1_4', section: 'Section 1: Fundamentals of Measurement (6 Questions)', text: 'Q1.4: Which of the following is NOT a reason for measurement?', options: ['Buying fruits at the market', 'A tailor stitching clothes', 'Estimating colors of objects', 'Doctor checking body temperature'] },
      { id: 'q1_5', section: 'Section 1: Fundamentals of Measurement (6 Questions)', text: 'Q1.5: The formula for measurement can be written as:', options: ['P = N - U', 'P = N ÷ U', 'P = N × U', 'P = N + U'] },
      { id: 'q1_6', section: 'Section 1: Fundamentals of Measurement (6 Questions)', text: 'Q1.6: In the measurement "2 metres", "metres" refers to:', options: ['Magnitude', 'Unit', 'Quantity', 'Standard'] },

      // Section 2
      { id: 'q2_1', section: 'Section 2: Physical Quantities (10 Questions)', text: 'Q2.1: Which of the following is NOT a fundamental quantity?', options: ['Length', 'Mass', 'Time', 'Area'] },
      { id: 'q2_2', section: 'Section 2: Physical Quantities (10 Questions)', text: 'Q2.2: The number of fundamental physical quantities in SI system is:', options: ['5', '6', '7', '8'] },
      { id: 'q2_3', section: 'Section 2: Physical Quantities (10 Questions)', text: 'Q2.3: Which of these is a fundamental quantity?', options: ['Area', 'Volume', 'Speed', 'Time'] },
      { id: 'q2_4', section: 'Section 2: Physical Quantities (10 Questions)', text: 'Q2.4: Temperature is classified as:', options: ['Derived quantity', 'Fundamental quantity', 'Non-standard quantity', 'Relative quantity'] },
      { id: 'q2_5', section: 'Section 2: Physical Quantities (10 Questions)', text: 'Q2.5: Density is made from which fundamental quantities?', options: ['Only mass', 'Only volume', 'Mass and volume', 'Mass and time'] },
      { id: 'q2_6', section: 'Section 2: Physical Quantities (10 Questions)', text: 'Q2.6: Speed can be calculated from:', options: ['Distance ÷ Time', 'Distance × Time', 'Distance + Time', 'Distance - Time'] },
      { id: 'q2_7', section: 'Section 2: Physical Quantities (10 Questions)', text: 'Q2.7: Which quantity depends on other quantities?', options: ['Length', 'Time', 'Force', 'Mass'] },
      { id: 'q2_8', section: 'Section 2: Physical Quantities (10 Questions)', text: 'Q2.8: Area (Length × Length) is an example of:', options: ['Fundamental quantity', 'Base quantity', 'Derived quantity', 'Non-standard quantity'] },
