<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words Quiz 🕉️</title>
  <style>
    :root {
      --pink: #ff6ec7;
      --purple: #a06cd5;
      --blue: #4cc9f0;
      --teal: #06d6a0;
      --yellow: #ffd166;
      --cream: #fff8f0;
      --ink: #1d2b53;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', sans-serif;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(135deg, #ffe0f0, #e0f7ff, #fff5d6);
      color: var(--ink);
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .nav-top {
      position: fixed;
      top: 20px;
      display: flex;
      gap: 15px;
      z-index: 101;
    }

    .nav-back { left: 20px; }
    .nav-home { right: 20px; }

    .icon-btn {
      background: var(--purple);
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 0 #7a3b97;
      transition: transform .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .icon-btn:hover { transform: translateY(-2px); }

    .header {
      text-align: center;
      margin: 60px 0 20px 0;
    }

    .big {
      font-size: clamp(50px, 10vw, 90px);
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    h1 {
      font-size: clamp(32px, 5vw, 56px);
      background: linear-gradient(90deg, #c77dff, #a06cd5, #ff6ec7, #ffd166);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: clamp(16px, 2.2vw, 22px);
      color: var(--blue);
      font-weight: bold;
    }

    .score-bar {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin: 18px 0 10px;
    }

    .pill {
      background: white;
      border: 3px solid var(--purple);
      border-radius: 50px;
      padding: 8px 20px;
      font-weight: bold;
      font-size: clamp(13px, 1.8vw, 16px);
      color: var(--ink);
      box-shadow: 0 3px 0 rgba(0,0,0,.08);
    }

    .reset-btn {
      background: var(--yellow);
      border: 3px solid #e0a800;
      border-radius: 50px;
      padding: 8px 20px;
      font-weight: bold;
      font-size: clamp(13px, 1.8vw, 16px);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 4px 0 #c78e00;
      transition: transform .15s;
    }
    .reset-btn:hover { transform: translateY(-2px); }

    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0 10px;
    }

    .tab-btn {
      background: var(--cream);
      border: 3px solid var(--purple);
      border-radius: 50px;
      padding: 10px 18px;
      font-weight: bold;
      font-size: clamp(13px, 1.8vw, 16px);
      color: var(--purple);
      cursor: pointer;
      transition: all .2s;
    }

    .tab-btn.active {
      background: var(--purple);
      color: white;
    }

    .tab-btn:hover { transform: translateY(-2px); }

    .deck {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      margin: 24px 0 10px;
    }

    .card-scene {
      perspective: 1000px;
      aspect-ratio: 3/4;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .5s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      border: 3px solid var(--purple);
      box-shadow: 0 6px 0 rgba(0,0,0,.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: white;
    }

    .card-front {
      background: var(--cream);
      padding: 10px;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-front .tap-hint {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 18px;
      opacity: .6;
    }

    .card-back {
      transform: rotateY(180deg);
      background: linear-gradient(135deg, #f3e6ff, #ffe6f2);
      padding: 14px 10px;
      text-align: center;
      gap: 6px;
    }

    .card-back .sanskrit-word {
      font-size: clamp(18px, 3vw, 26px);
      font-weight: bold;
      color: var(--purple);
    }

    .card-back .english-word {
      font-size: clamp(13px, 2vw, 17px);
      color: #1d5a45;
      font-style: italic;
    }

    .card-back .check-btns {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .know-btn, .learn-btn {
      border: none;
      border-radius: 50px;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      color: white;
    }

    .know-btn { background: var(--teal); box-shadow: 0 3px 0 #048a63; }
    .learn-btn { background: #ff8fa3; box-shadow: 0 3px 0 #d9536b; }
    .know-btn:hover, .learn-btn:hover { transform: translateY(-1px); }

    .card-scene.known .card-face { border-color: var(--teal); }
    .card-scene.learning .card-face { border-color: #ff8fa3; }

    .badge-mark {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 20px;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      font-size: 18px;
      color: #a06cd5;
    }
  </style>
</head>

<body>
  <div class="nav-top nav-back">
    <a href="../index.html" style="text-decoration:none;">
      <button class="icon-btn" title="Back to Prathama">⬅️</button>
    </a>
  </div>

  <div class="nav-top nav-home">
    <a href="../../../index.html" style="text-decoration:none;">
      <button class="icon-btn" title="Go to Home">🏠</button>
    </a>
  </div>

  <div class="container">
    <div class="header">
      <div class="big">🃏</div>
      <h1>शब्दक्रीडा · Word Cards</h1>
      <p class="subtitle">Tap a card to flip it and see the Sanskrit &amp; English word! 🌟</p>
    </div>

    <div class="score-bar">
      <div class="pill">✅ Know it: <span id="knowCount">0</span></div>
      <div class="pill">📚 Still learning: <span id="learnCount">0</span></div>
      <button class="reset-btn" onclick="resetAll()">🔄 Reset</button>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="deck" id="deck"></div>
  </div>

  <footer>Made with 💖 for Shreshta's learning adventure</footer>

  <script>
    const categories = [
      {
        key: 'shakani',
        label: '🥦 शाकानि (Vegetables)',
        words: [
          { san: 'उर्वारुकम्', eng: 'Cucumber', img: 'cucumber.png' },
          { san: 'मूलकम्', eng: 'Radish', img: 'radish.png' },
          { san: 'वृन्ताकः', eng: 'Brinjal / Eggplant', img: 'brinjal.png' },
          { san: 'गृञ्जनम्', eng: 'Carrot', img: 'carrot.png' },
          { san: 'भिण्डीनकम्', eng: 'Okra / Ladyfinger', img: 'okra.png' },
          { san: 'आलुकम्', eng: 'Potato', img: 'potato.png' },
          { san: 'कूष्माण्डः', eng: 'Pumpkin', img: 'pumpkin.png' },
          { san: 'जम्बीरम्', eng: 'Lemon', img: 'lemon.png' },
          { san: 'कारवेल्लम्', eng: 'Bitter Gourd', img: 'bittergourd.png' },
          { san: 'निष्पावः', eng: 'Peas', img: 'peas.png' },
          { san: 'आर्द्रकम्', eng: 'Ginger', img: 'ginger.png' },
          { san: 'शिग्रुः', eng: 'Drumstick', img: 'drumstick.png' }
        ]
      },
      {
        key: 'phalani',
        label: '🍎 फलानि (Fruits)',
        words: [
          { san: 'आम्रफलम्', eng: 'Mango', img: 'mango.png' },
          { san: 'कदलीफलम्', eng: 'Banana', img: 'banana.png' },
          { san: 'सेवफलम्', eng: 'Apple', img: 'apple.png' },
          { san: 'अनानसः', eng: 'Pineapple', img: 'pineapple.png' },
          { san: 'द्राक्षाफलम्', eng: 'Grapes', img: 'grapes.png' },
          { san: 'मधुकर्कटी', eng: 'Papaya', img: 'papaya.png' },
          { san: 'सीताफलम्', eng: 'Custard Apple', img: 'custardapple.png' },
          { san: 'नारङ्गम्', eng: 'Orange', img: 'orange.png' },
          { san: 'कलिङ्गफलम्', eng: 'Watermelon', img: 'watermelon.png' },
          { san: 'बहुबीजफलम्', eng: 'Guava', img: 'guava.png' },
          { san: 'दाडिमफलम्', eng: 'Pomegranate', img: 'pomegranate.png' },
          { san: 'नारिकेलम्', eng: 'Coconut', img: 'coconut.png' }
        ]
      },
      {
        key: 'vanyamrugah',
        label: '🐅 वन्यमृगाः (Wild Animals)',
        words: [
          { san: 'गजः', eng: 'Elephant', img: 'elephant.png' },
          { san: 'सिंहः', eng: 'Lion', img: 'lion.png' },
          { san: 'कृष्णमृगः', eng: 'Antelope / Deer', img: 'antelope.png' },
          { san: 'व्याघ्रः', eng: 'Tiger', img: 'tiger.png' },
          { san: 'हरिणः', eng: 'Deer', img: 'deer.png' },
          { san: 'चित्रकः', eng: 'Leopard', img: 'leopard.png' },
          { san: 'उष्ट्रः', eng: 'Camel', img: 'camel.png' },
          { san: 'भल्लूकः', eng: 'Bear', img: 'bear.png' },
          { san: 'वृकः', eng: 'Wolf', img: 'wolf.png' },
          { san: 'सूकरः', eng: 'Wild Boar / Pig', img: 'boar.png' },
          { san: 'शृगालः', eng: 'Jackal / Fox', img: 'jackal.png' },
          { san: 'चित्ररासभः', eng: 'Zebra', img: 'zebra.png' }
        ]
      },
      {
        key: 'praninah',
        label: '🐄 प्राणिनः (Animals)',
        words: [
          { san: 'धेनुः', eng: 'Cow', img: 'cow.png' },
          { san: 'वृषभः', eng: 'Bull / Ox', img: 'bull.png' },
          { san: 'शुनकः', eng: 'Dog', img: 'dog.png' },
          { san: 'बिडालः', eng: 'Cat', img: 'cat.png' },
          { san: 'अश्वः', eng: 'Horse', img: 'horse.png' },
          { san: 'वानरः', eng: 'Monkey', img: 'monkey.png' },
          { san: 'मूषकः', eng: 'Rat / Mouse', img: 'rat.png' },
          { san: 'चिक्रोडः', eng: 'Squirrel', img: 'squirrel.png' },
          { san: 'गर्दभः', eng: 'Donkey', img: 'donkey.png' },
          { san: 'महिषी', eng: 'Buffalo', img: 'buffalo.png' },
          { san: 'मेषः', eng: 'Sheep', img: 'sheep.png' },
          { san: 'शशः', eng: 'Rabbit', img: 'rabbit.png' }
        ]
      }
    ];

    // status: 'new' | 'known' | 'learning', keyed by "categoryKey|san"
    const status = {};
    let activeCategory = categories[0].key;

    function cardId(catKey, san) {
      return catKey + '|' + san;
    }

    function renderTabs() {
      const tabWrap = document.getElementById('categoryTabs');
      tabWrap.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (cat.key === activeCategory ? ' active' : '');
        btn.textContent = cat.label;
        btn.onclick = () => { activeCategory = cat.key; renderTabs(); renderDeck(); };
        tabWrap.appendChild(btn);
      });
    }

    function renderDeck() {
      const deck = document.getElementById('deck');
      deck.innerHTML = '';
      const cat = categories.find(c => c.key === activeCategory);

      cat.words.forEach(w => {
        const id = cardId(cat.key, w.san);
        const st = status[id] || 'new';

        const scene = document.createElement('div');
        scene.className = 'card-scene' + (st === 'known' ? ' known' : st === 'learning' ? ' learning' : '');

        const card = document.createElement('div');
        card.className = 'card';

        const front = document.createElement('div');
        front.className = 'card-face card-front';
        const img = document.createElement('img');
        img.src = 'images/' + w.img;
        img.alt = w.eng;
        front.appendChild(img);
        const hint = document.createElement('div');
        hint.className = 'tap-hint';
        hint.textContent = '👆';
        front.appendChild(hint);
        if (st === 'known') {
          const mark = document.createElement('div');
          mark.className = 'badge-mark';
          mark.textContent = '✅';
          front.appendChild(mark);
        } else if (st === 'learning') {
          const mark = document.createElement('div');
          mark.className = 'badge-mark';
          mark.textContent = '📚';
          front.appendChild(mark);
        }

        const back = document.createElement('div');
        back.className = 'card-face card-back';
        const sw = document.createElement('div');
        sw.className = 'sanskrit-word';
        sw.textContent = w.san;
        const ew = document.createElement('div');
        ew.className = 'english-word';
        ew.textContent = w.eng;
        const btns = document.createElement('div');
        btns.className = 'check-btns';
        const knowBtn = document.createElement('button');
        knowBtn.className = 'know-btn';
        knowBtn.textContent = '✅ I know it';
        knowBtn.onclick = (e) => { e.stopPropagation(); status[id] = 'known'; updateScore(); renderDeck(); };
        const learnBtn = document.createElement('button');
        learnBtn.className = 'learn-btn';
        learnBtn.textContent = '📚 Still learning';
        learnBtn.onclick = (e) => { e.stopPropagation(); status[id] = 'learning'; updateScore(); renderDeck(); };
        btns.appendChild(knowBtn);
        btns.appendChild(learnBtn);
        back.appendChild(sw);
        back.appendChild(ew);
        back.appendChild(btns);

        card.appendChild(front);
        card.appendChild(back);
        scene.appendChild(card);

        scene.addEventListener('click', () => {
          card.classList.toggle('flipped');
        });

        deck.appendChild(scene);
      });
    }

    function updateScore() {
      const known = Object.values(status).filter(s => s === 'known').length;
      const learning = Object.values(status).filter(s => s === 'learning').length;
      document.getElementById('knowCount').textContent = known;
      document.getElementById('learnCount').textContent = learning;
    }

    function resetAll() {
      Object.keys(status).forEach(k => delete status[k]);
      updateScore();
      renderDeck();
    }

    renderTabs();
    renderDeck();
    updateScore();
  </script>
</body>

</html>
