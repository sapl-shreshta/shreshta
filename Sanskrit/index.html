<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sanskrit 🕉️</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ffe0f0,#e0f7ff,#fff5d6);color:#1d2b53;padding:16px 12px;text-align:center;}
  .back{position:absolute;top:30px;left:30px;background:#a06cd5;color:white;text-decoration:none;
    padding:12px 24px;border-radius:50px;font-weight:bold;box-shadow:0 5px 0 #7b4aaf;}
  .big{font-size:clamp(80px,15vw,160px);animation:bounce 2s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}
  h1{font-size:clamp(40px,6vw,72px);margin:20px 0;
    background:linear-gradient(90deg,#c77dff,#a06cd5,#ff6ec7,#ffd166);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  p{font-size:clamp(20px,2.6vw,28px);color:#a06cd5;max-width:600px;margin-top:10px;}
  .badge{display:inline-block;background:#ffd166;color:#1d2b53;padding:16px 12px;border-radius:50px;
    font-weight:bold;margin-top:30px;border:3px solid #c77dff;font-size:22px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;max-width:500px;
    margin:30px auto 0;}
  .subject{background:#fff8f0;border-radius:16px;padding:18px 12px;text-align:center;text-decoration:none;
    color:#1d2b53;border:3px solid #c77dff;box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:all .25s cubic-bezier(0.34, 1.56, 0.64, 1);display:block;}
  .subject:hover{transform:translateY(-8px) scale(1.05);box-shadow:0 12px 24px rgba(0,0,0,.15);}
  .subject .icon{font-size:clamp(36px,6vw,48px);display:block;margin-bottom:6px;}
  .subject .name{font-size:clamp(14px,2vw,17px);font-weight:600;}
</style>
</head>
<body>
  <a class="back" href="../index.html">⬅️ Home</a>
  <div class="big">🕉️</div>
  <h1>संस्कृतम् · Sanskrit</h1>
  <p>श्लोकाः, कथाः, व्याकरणम् च — प्राचीन भाषां पठाम! 📜</p>
  <div class="grid">
    <a class="subject" href="Subhashitas/index.html"><span class="icon">📜</span><span class="name">Subhashitas</span></a>
  </div>
</body>
</html>
