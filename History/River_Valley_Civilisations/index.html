# River Valley Civilisations: Indus Valley

## Discovery and Extent
- 1921: Daya Ram Sahni discovered Harappa (on River Ravi, Punjab, Pakistan)
- 1922: Rakhal Das Banerji discovered Mohenjodaro (Larkana district, Sindh - "Mound of the Dead")
- Both sites belonged to Indus Valley, so called Indus Valley Civilisation
- Harappa was first city discovered in India, so also called Harappan Civilisation
- Discoveries nullified the old theory that Indian history started with the Aryans
- Showed an advanced civilisation existed in India about 4500 years ago
- Flourished between 2600 BCE and 1900 BCE
- Origin: developed from diverse agricultural communities (native origin)
- Mehrgarh (Pakistan), discovered 1974, shows earliest human settlement - predecessor of Harappan Civilisation
- More than 1300 sites discovered across North & Central India, Rajasthan, NW India, Sindh, Baluchistan

## Main Sites
- Harappa - Punjab, Pakistan (on River Ravi)
- Mohenjodaro - Sindh, Pakistan (on River Indus)
- Lothal - Gujarat: dockyard where ships docked
- Kalibangan - Rajasthan: terracotta bangles found
- Banawali - Haryana: well-constructed fort town
- Suktagendor - Pakistan: substantial stone walls and gateways
- Alamgirpur - Uttar Pradesh: easternmost Harappan settlement
- Dholavira - Gujarat: water reservoir for agriculture
- Rakhigarhi - Haryana

## Sources of Knowledge
- Based entirely on archaeological remains
- Great Bath, citadel, seals, houses, pots, ornaments
- Written records not yet deciphered

## Town Planning
- Cities divided into two: Upper town (Citadel) and Lower town
  - Citadel 
    - raised ground, high walls, protection against floods
    - Citadel held public buildings - granaries and religious buildings
    - Ruling class probably lived in the Citadel
  - Lower town
    - much bigger, houses and workplaces of common people
    - Each house had a courtyard, several rooms, a toilet, and a well
    - Buildings made of burnt bricks; houses had flat roofs, many double-storeyed
    - Roads: wide, straight, intersecting at right angles - the grid system
    - Smaller streets joined main roads at right angles
    - Streets had lamp-posts and rounded corners so carts could pass easily
    - Houses built on both sides of streets

## The Great Bath
- Found at Mohenjodaro - rectangular structure like a swimming pool
- Example of beautiful, precise brickwork
- Used possibly for religious/ritual bathing
- Had six entrances, a central bathing pool, galleries and dressing rooms
- Steps led to the bottom; outlet to drain used water
- Water taken from an adjacent well
- Assembly Hall also found at Mohenjodaro - stood on 20 brick pillars, used for prayer or assembly

## Granaries
- Largest building at Mohenjodaro is the Great Granary - used for storing grain
- At Harappa: six granaries in the citadel, on brick platforms
- Circular platforms nearby possibly used for threshing grain
- Two-room shelters nearby may have been dwellings for labourers
- Granaries built close to the river bank so grain could be transported by boats

## Drainage System
- Considered incredible for its time
- Rooms had sloping floors with drains connected to street drains
- Drains covered with stone slabs or bricks, had manholes at regular intervals
- Drains cleaned regularly; main drains emptied outside the city
- Shows people were conscious of hygiene and sanitation

## Governance
- No evidence of a king or single ruler
- Cities probably administered by a committee of rich merchants and priests
- Committee looked after trade, taxes, law and order

## Social Divisions
- Society divided into three classes
- Ruling class: rich merchants and priests - lived in the Citadel
- Second class: small merchants, artisans and craftsmen - lived in the lower town
- Third class: labourers - lived in outer limits of the city
- Many farmers lived and worked in villages around the cities

## Occupations
### Agriculture
- Main crops: wheat, rice, mustard, sesame, barley
- Also grew dates, field peas; ate meat, fish, eggs, fruits, milk
- Indus people were earliest in the world to cultivate cotton
- Animals domesticated: oxen, buffaloes, goats, sheep, pigs, cats, dogs
- Horse remains found at Surkotada; elephants well known; humped bulls favoured

### Trade
- Traded internally and with other civilisations
- Traded with Mesopotamia (modern Iraq) and Afghanistan, also Egypt and Iran
- Mesopotamian seals found in Harappan cities and vice versa
- Trade carried on from the port of Lothal, where a big dockyard was found
- Weights and measures used; barter system for trade
- Internal trade with places in modern Karnataka, Rajasthan and Kashmir

### Other Occupations
- Weaving, pottery making, jewellery making, metal work
- Toy-making, stone cutting, seal making
- Pottery making reached great heights - potters used the potter's wheel

## Amusements and Recreation
- Preferred indoor games over outdoor games
- Toys: small clay carts, animal figures, rattles, whistles, dolls (all terracotta)
- Enjoyed singing and dancing
- Played games similar to modern chess and dice

## Dress and Ornaments
- People usually wore cotton clothes; woollen clothes also worn
- Men wore two pieces of cloth: a 'shawl' on the upper body and a lower garment like a dhoti
- Women wore short skirts tied at the waist
- Both men and women wore ornaments: necklaces, bracelets, bangles, earrings
- Men wore amulets
- Rich wore gold and silver jewellery; poor wore bone, copper and shell jewellery

## Art and Craft
- Bronze figure of the Dancing Girl found at Mohenjodaro
- Stone statue of a bearded nobleman/priest (the "Priest King") wearing a shawl
- Painted pottery showed animals, birds, and men - great artistic skill
- Produced tools and weapons: axes, saws, knives, spears
- Important crafts: spinning, brick-laying, boat-making, seal-making, terracotta manufacture
- Beautiful jewellery found at Harappa

### Seals
- Greatest artistic creations of the Harappan culture
- About 2000 seals found - square or rectangular clay tablets
- Carry short inscriptions and pictures: one-horned bull, buffalo, tiger, elephant, goat
- Used by merchants to mark their goods
- Script on seals not yet deciphered
- Pashupati Seal: three-headed figure surrounded by a tiger, rhinoceros, buffalo, elephant, two deer - possibly earliest image of Shiva as "Pashupati"

## Religion
- Worshipped trees (Pipal tree was sacred) and animals
- Clay figures of Mother Goddess found at many sites
- Most important animal worshipped was the humped bull
- Gods worshipped in form of trees, animals, and human beings - but no temples
- Believed in life after death - buried the dead with ornaments and belongings

## Script
- Harappans developed the art of writing - nearly 400 signs found
- Historians have not been able to interpret the script
- A pictographic script reporting words and objects
- Earliest form of writing discovered in India

## Decline of the Civilisation
- Came to an abrupt end - real cause unknown, several theories:
- Invasion by foreigners, possibly the Aryans
- Natural calamities like floods, earthquakes, epidemics
- River Indus may have changed course, turning the region into a desert
- Expansion of neighbouring desert increased soil salinity, reduced fertility
- Around 1750 BCE, Harappa and Mohenjodaro declined; other cities faded out gradually
- Mohenjodaro was flooded more than once

## Key Points to Remember
- Indus Valley Civilisation was the earliest known urban civilisation of India
- Special features: well-planned cities, proper drainage, the Great Bath, granaries, distinctive seals
- Traded with Mesopotamia and Afghanistan
- Flourished roughly between 2600 BCE and 1900 BCE
- Mohenjodaro is a UNESCO World Heritage Site
- Belonged to the Bronze Age - bronzesmiths mixed copper (from Rajasthan/Baluchistan) and tin (from Afghanistan/Iran)
