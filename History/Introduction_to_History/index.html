# Introduction to History

## History and Prehistory
- History means inquiry or research from Greek word historia
- Study of past events in order based on written records
- Prehistory is before written records, studied by fossils, tools, bones, and shelters
- Important prehistoric discoveries: fire, wheel, no exact dates

## Importance of Studying the Past
- Understand ancestors' food, clothes, beliefs, and crafts
- Learn about past societies and cultures
- Know history and culture of our country and others
- Culture includes manners, dress, language, religion, rituals, laws
- History helps understand people, explain changes, give moral lessons, shape identity, and teach research skills

## Chronology
- Arrangement of events by time order
- Helps understand sequence of events
- BCE (Before Common Era) counts years before Jesus, backwards (100 BCE comes before 99 BCE)
- CE (Common Era) counts years after Jesus, forwards (99 CE comes before 100 CE)

## Geographical Factors
- Geography shapes history of a region
- Indian subcontinent includes India and neighbors
- Fertile plains of Indus and Ganga rivers supported early settlements
- Himalayas acted as barrier with some passes for contact
- Deccan Plateau divided by mountains, rivers, and plateaus
- Natural barriers like mountains protected regions

## Causes of Cultural Diversity
- People traveled for trade, livelihood, and exploration
- Religious leaders spread teachings
- Rulers expanded empires by conquest
- Foreign travelers shared ideas and customs
- Exchange of ideas created diverse culture

## Sources of History
### Literary Sources
- Written records about social, political, economic, cultural life
- Early writings on palm leaves or birch bark (manuscripts) before paper
- Manuscripts on medicine, science, religion, preserved in temples and libraries
- Languages: Sanskrit, Pali, Prakrit in north; Tamil in south
- Indigenous works by Indian authors; foreign works by travelers like Megasthenes and Fa-Hien
- Indigenous literature
  - Sacred: Vedas, Ramayana, Mahabharata, Buddhist Tripitakas, Jain Angas
  - Secular: poetry, drama, science, politics (e.g., Arthashastra by Kautilya)
- Historians learn ancient languages and scripts (e.g., Prakrit, Brahmi)
- Harappan script remains undeciphered

### Archaeological Sources
- Study of material remains by archaeologists through excavation
- Inscriptions on stones, pillars, metal plates record kings' orders and victories
- Study of inscriptions is epigraphy
- Includes tools, weapons, pottery, paintings, sculptures, jewellery, coins, buildings, seals
- Grains, plant remains, animal bones reveal food and livelihood
- Monuments like temples, forts, Sanchi Stupa, Ashokan pillars show art and religion
- Coins show kings, empires, trade, social conditions
- Study of coins is numismatics

## Conclusion
- Literary, archaeological, and oral sources reveal complete past
- Historians and archaeologists use these sources as clues like detectives
- Studying history is an adventure piecing together evidence from the past
